minimum_pre_commit_version: '2.9.2'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace          # Удаляет лишние пробелы в конце строк
      - id: end-of-file-fixer            # Добавляет пустую строку в конец файла, если ее нет
      - id: check-yaml                   # Проверяет синтаксис YAML-файлов
      - id: check-added-large-files      # Блокирует коммит слишком больших файлов (например, весов моделей)
        args: ['--maxkb=1000']           # Максимальный размер файла — 1000 КБ (1 МБ)


  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3

 
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]